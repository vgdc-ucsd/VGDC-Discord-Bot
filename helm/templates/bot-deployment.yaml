apiVersion: apps/v1
kind: Deployment
metadata:
  name: bot
  labels:
    app: bot
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: bot
  template: 
    metadata: 
      labels: 
        app: bot
    spec:
      volumes:
      - name: sqlite-data
        persistentVolumeClaim:
          claimName: sqlite-pvc
      - name: appsettings-secret
        secret:
          secretName: app-settings
      securityContext:
        fsGroup: 1000
      imagePullSecrets:
      - name: ghcr-pull-secret
      containers:
      - name: bot
        image: {{ .Values.image.name }}:{{ .Values.image.tag | default "latest" }}
        imagePullPolicy: Always
        envFrom:
        - configMapRef:
            name: bot-config
        volumeMounts:
        - name: sqlite-data
          mountPath: /data
        - name: appsettings-secret
          mountPath: /app/appsettings.json
          subPath: appsettings.json
          readOnly: true
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "512Mi"